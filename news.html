<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E1A" />
<title>News — D'voice</title>

<link rel="stylesheet" href="css/core.css" />
<link rel="stylesheet" href="css/components/cards.css" />
<link rel="stylesheet" href="css/components/interactive.css" />
<link rel="stylesheet" href="css/widgets/header.css" />
<link rel="stylesheet" href="css/widgets/toast.css" />
<link rel="stylesheet" href="css/widgets/states.css" />
<link rel="stylesheet" href="css/pages/news.css" />

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
<div class="app">

  <header class="resource-page-header">
    <button class="btn-icon" id="news-back" aria-label="Back">
      <i class="ri-arrow-left-s-line"></i>
    </button>
    <span class="resource-page-header-title" id="news-page-title">News</span>
    <div style="width:40px"></div>
  </header>

  <div class="resource-page-content">
    <div class="state-container" data-state="news-page-content">

      <!-- Loading: skeleton, matches both modes -->
      <div class="state-loading">
        <div class="news-skeleton-list">
          <div class="news-skeleton-card">
            <div class="skeleton skeleton-news-media"></div>
            <div class="skeleton skeleton-news-title"></div>
            <div class="skeleton skeleton-news-excerpt"></div>
            <div class="skeleton skeleton-news-foot"></div>
          </div>
          <div class="news-skeleton-card">
            <div class="skeleton skeleton-news-title"></div>
            <div class="skeleton skeleton-news-excerpt"></div>
            <div class="skeleton skeleton-news-foot"></div>
          </div>
        </div>
      </div>

      <!-- Empty (list mode, no items) -->
      <div class="state-empty" hidden>
        <div class="empty-state">
          <i class="ri-newspaper-line"></i>
          <h2>No news yet</h2>
          <p>Campus news will appear here as it's published.</p>
          <a href="index.html#home" class="btn-primary" style="max-width:200px;margin:16px auto 0;text-decoration:none;display:flex">
            <span>Back to Home</span>
          </a>
        </div>
      </div>

      <!-- Not found (detail mode, bad ID) -->
      <div class="state-not-found" hidden>
        <div class="empty-state">
          <i class="ri-error-warning-line"></i>
          <h2>Article not found</h2>
          <p>This article may have been removed or the link is invalid.</p>
          <a href="news.html" class="btn-primary" style="max-width:200px;margin:16px auto 0;text-decoration:none;display:flex">
            <span>Back to News</span>
          </a>
        </div>
      </div>

      <!-- Error (fetch failed) -->
      <div class="state-error" hidden>
        <div class="empty-state">
          <i class="ri-error-warning-line"></i>
          <h2>Couldn't load news</h2>
          <p>Check your connection and try again.</p>
          <button class="btn-primary" id="news-retry" style="max-width:200px;margin:16px auto 0">
            <span>Retry</span>
          </button>
        </div>
      </div>

      <div class="state-data" hidden></div>

    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toast-message"></span>
    <button class="toast-action" id="toast-action">Undo</button>
  </div>

</div>

<script type="module" src="js/pages/news.js"></script>
</body>
</html>
