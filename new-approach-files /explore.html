<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Explore · D'voice</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    /* Palette: deep indigo-blue base, cyan-teal secondary.
       Deliberately not the "AI app" gradient blue. */
    --bg:            #0e1420;
    --surface:       #161f30;
    --surface-2:     #1d2942;
    --border:        #26324a;
    --text:          #eef2f8;
    --text-muted:    #94a3b8;
    --text-dim:      #64748b;

    --primary:       #4f7cff;   /* blue, slightly desaturated */
    --primary-soft:  #23345e;
    --accent:        #2dd4bf;   /* teal secondary, semantic */

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 6px 18px rgba(0,0,0,.35);
  }

  /* ---------- Reset / base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input  { font: inherit; color: inherit; }
  ul { list-style: none; margin: 0; padding: 0; }

  /* ---------- Layout ---------- */
  .explore {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--space-4) var(--space-4) var(--space-6);
  }

  .explore__header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: var(--space-3) 0 var(--space-3);
    margin: 0 calc(var(--space-4) * -1) var(--space-3);
    padding-left: var(--space-4);
    padding-right: var(--space-4);
    border-bottom: 1px solid var(--border);
  }
  .explore__title {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 var(--space-3);
    letter-spacing: -0.01em;
  }

  /* ---------- Search ---------- */
  .search {
    position: relative;
    margin-bottom: var(--space-3);
  }
  .search__input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 11px 40px 11px 38px;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .search__input::placeholder { color: var(--text-dim); }
  .search__input:focus {
    border-color: var(--primary);
    background: var(--surface-2);
  }
  .search__icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }
  .search__clear {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }
  .search__clear:hover { background: var(--surface-2); }
  .search__clear.is-visible { display: flex; }

  /* ---------- Filter chips ---------- */
  .filters {
    display: flex;
    gap: var(--space-2);
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .filters::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover { color: var(--text); }
  .chip.is-open,
  .chip.has-value {
    color: var(--text);
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .chip__count {
    background: var(--accent);
    color: #06231f;
    font-size: 11px;
    font-weight: 600;
    border-radius: 999px;
    padding: 1px 6px;
    line-height: 1.4;
  }

  /* Filter popover */
  .filter-popover {
    position: absolute;
    left: var(--space-4);
    right: var(--space-4);
    top: calc(100% + 6px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    padding: var(--space-3);
    z-index: 20;
    display: none;
  }
  .filter-popover.is-open { display: block; }
  .filter-popover__title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-dim);
    margin: 0 0 var(--space-2);
  }
  .filter-popover__options {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .opt {
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    background: var(--surface-2);
  }
  .opt.is-selected {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(45,212,191,.12);
  }
  .filter-popover__actions {
    display: flex;
    justify-content: space-between;
    margin-top: var(--space-3);
  }
  .link-btn { color: var(--text-muted); font-size: 13px; }
  .link-btn:hover { color: var(--text); }

  /* ---------- Result summary ---------- */
  .result-summary {
    font-size: 13px;
    color: var(--text-muted);
    margin: var(--space-3) 0 var(--space-3);
    min-height: 18px;
  }
  .result-summary strong { color: var(--text); font-weight: 600; }

  /* ---------- Cards ---------- */
  .cards { display: grid; gap: var(--space-3); }

  .card {
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    transition: border-color .15s, transform .06s;
  }
  .card:hover { border-color: var(--primary); }
  .card:active { transform: scale(.995); }

  .card__title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card__course {
    font-size: 13px;
    color: var(--text-muted);
  }
  .card__code {
    color: var(--accent);
    font-weight: 600;
    margin-right: 6px;
  }

  .card__badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    background: var(--surface-2);
  }
  .badge--type {
    color: var(--accent);
    border-color: rgba(45,212,191,.35);
    background: rgba(45,212,191,.08);
  }

  .card__meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ---------- Skeletons ---------- */
  .skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sk-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg,
      var(--surface-2) 25%,
      #24314e 37%,
      var(--surface-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  .sk-line--title { height: 16px; width: 70%; }
  .sk-line--sub   { width: 40%; }
  .sk-line--meta  { width: 55%; }
  @keyframes shimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sk-line { animation: none; }
  }

  /* ---------- States ---------- */
  .state {
    padding: var(--space-6) var(--space-4);
    text-align: center;
    color: var(--text-muted);
  }
  .state__title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 var(--space-2);
  }
  .state__body { font-size: 13px; margin: 0 0 var(--space-4); }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 9px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
  }
  .btn--primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .btn:hover { filter: brightness(1.08); }

  /* ---------- Load more ---------- */
  .load-more {
    display: flex;
    justify-content: center;
    padding: var(--space-5) 0 var(--space-3);
  }
  .load-more__end {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: var(--space-5) 0;
  }

  /* ---------- Larger screens ---------- */
  @media (min-width: 640px) {
    .cards { grid-template-columns: 1fr 1fr; }
    .explore__title { font-size: 22px; }
  }
  @media (min-width: 960px) {
    .explore { max-width: 960px; }
  }
</style>
</head>
<body>

<main class="explore" id="explore">
  <header class="explore__header">
    <h1 class="explore__title">Explore</h1>

    <div class="search">
      <span class="search__icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <label for="search-input" class="sr-only" style="position:absolute;left:-9999px;">
        Search resources
      </label>
      <input
        id="search-input"
        class="search__input"
        type="search"
        autocomplete="off"
        placeholder="Search by course code, title, or topic"
      />
      <button id="search-clear" class="search__clear" aria-label="Clear search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"></line>
          <line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="filters" id="filters" role="toolbar" aria-label="Filters"></div>
    <div class="filter-popover" id="filter-popover" role="dialog" aria-label="Filter options"></div>
  </header>

  <p class="result-summary" id="result-summary" aria-live="polite"></p>

  <section id="results" aria-label="Resource results"></section>

  <div class="load-more" id="load-more"></div>
</main>

<script>
(() => {
  "use strict";

  /* =========================================================
     MOCK DATA — replace with fetch when the API exists.
     Shape is the contract the rest of the page depends on.
     ========================================================= */
  const RESOURCES = [
    { id:"r1", title:"MTH 201 Past Questions (2019–2023)", courseCode:"MTH 201",
      courseTitle:"Mathematical Methods I", contentType:"Past question", format:"PDF",
      faculty:"Science", level:"200", contributor:"Dept. of Mathematics",
      dateAdded:"2026-09-12", downloads:412 },

    { id:"r2", title:"Thermodynamics — Full Lecture Notes", courseCode:"PHY 203",
      courseTitle:"Thermodynamics", contentType:"Lecture note", format:"PDF",
      faculty:"Science", level:"200", contributor:"Dr. A. Bello",
      dateAdded:"2026-09-04", downloads:208 },

    { id:"r3", title:"Organic Chemistry Reaction Map", courseCode:"CHM 202",
      courseTitle:"Organic Chemistry", contentType:"Summary / study guide", format:"PDF",
      faculty:"Science", level:"200", contributor:"Student contributor",
      dateAdded:"2026-08-28", downloads:97 },

    { id:"r4", title:"ECO 101 — Principles of Economics Slides", courseCode:"ECO 101",
      courseTitle:"Principles of Economics", contentType:"Slide / presentation", format:"PPTX",
      faculty:"Social Sciences", level:"100", contributor:"Dr. O. Ijeoma",
      dateAdded:"2026-09-18", downloads:53 },

    { id:"r5", title:"CSC 301 Algorithms — Compiled Reference", courseCode:"CSC 301",
      courseTitle:"Algorithms & Data Structures", contentType:"Textbook / reference", format:"PDF",
      faculty:"Science", level:"300", contributor:"Student contributor",
      dateAdded:"2026-09-22", downloads:301 },

    { id:"r6", title:"GST 101 Communication Skills — Past Questions", courseCode:"GST 101",
      courseTitle:"Communication in English", contentType:"Past question", format:"PDF",
      faculty:"General Studies", level:"100", contributor:"D'voice Team",
      dateAdded:"2026-10-01", downloads:722 },

    { id:"r7", title:"BIO 105 Cell Biology — Lecture Notes", courseCode:"BIO 105",
      courseTitle:"Cell Biology", contentType:"Lecture note", format:"DOCX",
      faculty:"Science", level:"100", contributor:"Dr. F. Okoro",
      dateAdded:"2026-07-30", downloads:141 },

    { id:"r8", title:"LAW 201 Contract Law — Case Summary", courseCode:"LAW 201",
      courseTitle:"Law of Contract", contentType:"Summary / study guide", format:"PDF",
      faculty:"Law", level:"200", contributor:"Student contributor",
      dateAdded:"2026-09-30", downloads:88 },

    { id:"r9", title:"ACC 201 Financial Accounting — Slides", courseCode:"ACC 201",
      courseTitle:"Financial Accounting I", contentType:"Slide / presentation", format:"PPTX",
      faculty:"Management Sciences", level:"200", contributor:"Dr. K. Adeyemi",
      dateAdded:"2026-09-08", downloads:76 },

    { id:"r10", title:"PHY 101 Mechanics — Past Questions", courseCode:"PHY 101",
      courseTitle:"General Physics I", contentType:"Past question", format:"PDF",
      faculty:"Science", level:"100", contributor:"D'voice Team",
      dateAdded:"2026-10-05", downloads:509 },

    { id:"r11", title:"ENG 201 African Literature — Reading List",
      courseCode:"ENG 201", courseTitle:"African Literature",
      contentType:"Textbook / reference", format:"PDF",
      faculty:"Arts", level:"200", contributor:"Dr. N. Eze",
      dateAdded:"2026-08-15", downloads:34 },

    { id:"r12", title:"STA 111 Descriptive Statistics — Notes",
      courseCode:"STA 111", courseTitle:"Descriptive Statistics",
      contentType:"Lecture note", format:"PDF",
      faculty:"Science", level:"100", contributor:"Student contributor",
      dateAdded:"2026-09-19", downloads:212 }
  ];

  const FACULTIES      = ["Science","Arts","Social Sciences","Law","Management Sciences","General Studies"];
  const LEVELS         = ["100","200","300","400","500"];
  const CONTENT_TYPES  = ["Past question","Lecture note","Summary / study guide","Textbook / reference","Slide / presentation"];
  const FORMATS        = ["PDF","DOCX","PPTX"];

  const PAGE_SIZE = 24;
  const SORT_DEFAULT = "newest";

  /* =========================================================
     State
     ========================================================= */
  const state = {
    query: "",
    filters: { faculty:[], level:[], contentType:[], format:[] },
    page: 1,
    loading: false,
    error: false,
    openPopover: null   // "faculty" | "level" | "contentType" | "format" | null
  };

  /* =========================================================
     Elements
     ========================================================= */
  const el = {
    search:      document.getElementById("search-input"),
    searchClear: document.getElementById("search-clear"),
    filters:     document.getElementById("filters"),
    popover:     document.getElementById("filter-popover"),
    summary:     document.getElementById("result-summary"),
    results:     document.getElementById("results"),
    loadMore:    document.getElementById("load-more")
  };

  /* =========================================================
     Filtering / sorting
     ========================================================= */
  function matchesQuery(r, q) {
    if (!q) return true;
    const hay = [r.title, r.courseCode, r.courseTitle, r.contributor]
      .join(" ").toLowerCase();
    return hay.includes(q);
  }

  function matchesFilters(r) {
    const f = state.filters;
    if (f.faculty.length     && !f.faculty.includes(r.faculty))         return false;
    if (f.level.length       && !f.level.includes(r.level))             return false;
    if (f.contentType.length && !f.contentType.includes(r.contentType)) return false;
    if (f.format.length      && !f.format.includes(r.format))           return false;
    return true;
  }

  function getFiltered() {
    const q = state.query.trim().toLowerCase();
    const list = RESOURCES
      .filter(r => matchesQuery(r, q) && matchesFilters(r));
    // Default sort: newest first
    list.sort((a,b) => (a.dateAdded < b.dateAdded ? 1 : -1));
    return list;
  }

  function activeFilterCount(key) { return state.filters[key].length; }
  function totalActiveFilters() {
    return Object.values(state.filters).reduce((n, arr) => n + arr.length, 0);
  }

  /* =========================================================
     Rendering
     ========================================================= */
  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { month:"short", year:"numeric" });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function cardHTML(r) {
    const badges = [
      r.contentType ? `<span class="badge badge--type">${escapeHtml(r.contentType)}</span>` : "",
      r.format      ? `<span class="badge">${escapeHtml(r.format)}</span>` : ""
    ].join("");

    const metaLeft  = r.contributor ? escapeHtml(r.contributor) : "";
    const metaRightParts = [];
    if (r.dateAdded) metaRightParts.push(formatDate(r.dateAdded));
    if (typeof r.downloads === "number") metaRightParts.push(`${r.downloads} downloads`);
    const metaRight = metaRightParts.join(" · ");

    return `
      <button class="card" data-id="${escapeHtml(r.id)}"
              aria-label="Open details for ${escapeHtml(r.title)}">
        <div class="card__title">${escapeHtml(r.title)}</div>
        <div class="card__course">
          <span class="card__code">${escapeHtml(r.courseCode || "")}</span>
          ${escapeHtml(r.courseTitle || "")}
        </div>
        <div class="card__badges">${badges}</div>
        <div class="card__meta">
          <span>${metaLeft}</span>
          <span>${metaRight}</span>
        </div>
      </button>
    `;
  }

  function renderSkeletons(n = 6) {
    const sk = Array.from({ length: n }).map(() => `
      <div class="skeleton" aria-hidden="true">
        <div class="sk-line sk-line--title"></div>
        <div class="sk-line sk-line--sub"></div>
        <div class="sk-line sk-line--meta"></div>
      </div>
    `).join("");
    el.results.innerHTML = `<div class="cards">${sk}</div>`;
  }

  function renderEmptyCatalogue() {
    el.results.innerHTML = `
      <div class="state">
        <p class="state__title">No resources yet</p>
        <p class="state__body">D'voice is still being populated. Check back soon.</p>
      </div>`;
  }

  function renderNoResults() {
    el.results.innerHTML = `
      <div class="state">
        <p class="state__title">No matches</p>
        <p class="state__body">
          Nothing matches your current search and filters.
        </p>
        <button class="btn btn--primary" id="clear-all">Clear search & filters</button>
      </div>`;
    const btn = document.getElementById("clear-all");
    if (btn) btn.addEventListener("click", clearAll);
  }

  function renderError() {
    el.results.innerHTML = `
      <div class="state">
        <p class="state__title">Couldn't load resources</p>
        <p class="state__body">Check your connection and try again.</p>
        <button class="btn btn--primary" id="retry">Retry</button>
      </div>`;
    const btn = document.getElementById("retry");
    if (btn) btn.addEventListener("click", () => { state.error = false; refresh(); });
  }

  function renderResults() {
    if (state.error) { renderError(); el.loadMore.innerHTML = ""; return; }

    const all = getFiltered();

    // Empty catalogue (no data at all) vs no-results (filters/search excluded everything)
    if (RESOURCES.length === 0) { renderEmptyCatalogue(); el.loadMore.innerHTML = ""; return; }
    if (all.length === 0)       { renderNoResults();       el.loadMore.innerHTML = ""; return; }

    const visible = all.slice(0, state.page * PAGE_SIZE);

    el.results.innerHTML = `<div class="cards">${visible.map(cardHTML).join("")}</div>`;

    // Load more / end-of-list
    if (visible.length < all.length) {
      el.loadMore.innerHTML = `
        <button class="btn" id="load-more-btn">
          Load more (${all.length - visible.length} remaining)
        </button>`;
      document.getElementById("load-more-btn")
        .addEventListener("click", loadMore);
    } else {
      el.loadMore.innerHTML = `<div class="load-more__end">End of results</div>`;
    }

    // Result summary
    const n = all.length;
    const parts = [`<strong>${n}</strong> resource${n === 1 ? "" : "s"}`];
    const fa = totalActiveFilters();
    if (fa) parts.push(`${fa} filter${fa === 1 ? "" : "s"} applied`);
    if (state.query.trim()) parts.push(`matching "${escapeHtml(state.query.trim())}"`);
    el.summary.innerHTML = parts.join(" · ");
  }

  function renderFilterChips() {
    const defs = [
      { key:"faculty",     label:"Faculty" },
      { key:"level",       label:"Level" },
      { key:"contentType", label:"Type" },
      { key:"format",      label:"Format" }
    ];
    el.filters.innerHTML = defs.map(d => {
      const count = activeFilterCount(d.key);
      const cls = [
        "chip",
        state.openPopover === d.key ? "is-open" : "",
        count ? "has-value" : ""
      ].filter(Boolean).join(" ");
      return `
        <button class="${cls}" data-filter="${d.key}"
                aria-expanded="${state.openPopover === d.key}">
          ${d.label}
          ${count ? `<span class="chip__count">${count}</span>` : ""}
        </button>`;
    }).join("");

    el.filters.querySelectorAll("[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => openPopover(btn.dataset.filter));
    });
  }

  function openPopover(key) {
    if (state.openPopover === key) { closePopover(); return; }
    state.openPopover = key;
    renderFilterChips();
    renderPopover();
  }

  function closePopover() {
    state.openPopover = null;
    el.popover.classList.remove("is-open");
    el.popover.innerHTML = "";
    renderFilterChips();
  }

  function renderPopover() {
    const key = state.openPopover;
    if (!key) { el.popover.classList.remove("is-open"); el.popover.innerHTML = ""; return; }

    const OPTIONS = {
      faculty: FACULTIES, level: LEVELS,
      contentType: CONTENT_TYPES, format: FORMATS
    }[key];

    const selected = state.filters[key];

    el.popover.innerHTML = `
      <p class="filter-popover__title">${
        { faculty:"Faculty", level:"Level", contentType:"Content type", format:"Format" }[key]
      }</p>
      <div class="filter-popover__options">
        ${OPTIONS.map(o => `
          <button class="opt ${selected.includes(o) ? "is-selected" : ""}"
                  data-opt="${escapeHtml(o)}">${escapeHtml(o)}</button>
        `).join("")}
      </div>
      <div class="filter-popover__actions">
        <button class="link-btn" id="pop-clear">Clear</button>
        <button class="link-btn" id="pop-done">Done</button>
      </div>`;
    el.popover.classList.add("is-open");

    el.popover.querySelectorAll("[data-opt]").forEach(b => {
      b.addEventListener("click", () => toggleOption(key, b.dataset.opt));
    });
    document.getElementById("pop-clear").addEventListener("click", () => {
      state.filters[key] = []; state.page = 1;
      renderPopover(); renderFilterChips(); renderResults();
    });
    document.getElementById("pop-done").addEventListener("click", closePopover);
  }

  function toggleOption(key, value) {
    const arr = state.filters[key];
    const i = arr.indexOf(value);
    if (i === -1) arr.push(value); else arr.splice(i, 1);
    state.page = 1;
    renderPopover(); renderFilterChips(); renderResults();
  }

  /* =========================================================
     Actions
     ========================================================= */
  function loadMore() {
    if (state.loading) return;
    state.loading = true;
    // Simulated fetch latency — replace with real pagination.
    setTimeout(() => {
      state.page += 1;
      state.loading = false;
      renderResults();
    }, 250);
  }

  function clearAll() {
    state.query = "";
    state.filters = { faculty:[], level:[], contentType:[], format:[] };
    state.page = 1;
    el.search.value = "";
    el.searchClear.classList.remove("is-visible");
    renderFilterChips(); renderResults();
  }

  /* =========================================================
     Events
     ========================================================= */
  el.search.addEventListener("input", () => {
    state.query = el.search.value;
    state.page = 1;
    el.searchClear.classList.toggle("is-visible", state.query.length > 0);
    renderResults();
  });
  el.searchClear.addEventListener("click", () => {
    state.query = ""; state.page = 1;
    el.search.value = "";
    el.searchClear.classList.remove("is-visible");
    el.search.focus();
    renderResults();
  });

  document.addEventListener("click", (e) => {
    if (!state.openPopover) return;
    const insidePopover = el.popover.contains(e.target);
    const onChip = e.target.closest("[data-filter]");
    if (!insidePopover && !onChip) closePopover();
  });

  // Delegated card tap — hands off to the (not yet built) details sheet.
  el.results.addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    const resource = RESOURCES.find(r => r.id === card.dataset.id);
    if (!resource) return;
    // TODO: open resource details bottom sheet with `resource`.
    console.log("[Explore] open details sheet for", resource);
  });

  /* =========================================================
     Init
     ========================================================= */
  function refresh() {
    renderFilterChips();
    renderResults();
  }

  // Simulate first load with skeletons.
  renderSkeletons(6);
  setTimeout(refresh, 350);
})();
</script>

</body>
</html>
